<!-- modal.html -->

<div id="modal" class="modal">
    <div class="modal-content">

        <h2>Registrar acceso</h2>

        <form id="formRegistro">

            <!-- Búsqueda del visitante -->
            <div class="campo-formulario">
                <label for="visitanteBusqueda">
                    Visitante
                </label>

                <input
                    type="text"
                    id="visitanteBusqueda"
                    name="visitante"
                    placeholder="Escribe el nombre del visitante"
                    autocomplete="off"
                    required
                >

                <!-- Coincidencias de visitantes -->
                <div
                    id="resultadosVisitantes"
                    class="resultados-busqueda"
                ></div>
            </div>

            <!-- Formulario para visitante nuevo -->
            <div
                id="formNuevoVisitante"
                class="nuevo-visitante"
                style="display: none;"
            >
                <div class="mensaje-nuevo-visitante">
                    <strong>No encontramos este visitante.</strong>

                    <span>
                        Completa la información para registrarlo.
                    </span>
                </div>

                <div class="campo-formulario">
                    <label for="nuevoNombre">
                        Nombre
                    </label>

                    <input
                        type="text"
                        id="nuevoNombre"
                        placeholder="Nombre"
                    >
                </div>

                <div class="campo-formulario">
                    <label for="nuevoApellido">
                        Apellido
                    </label>

                    <input
                        type="text"
                        id="nuevoApellido"
                        placeholder="Apellido"
                    >
                </div>

                <div class="campo-formulario">
                    <label for="nuevaIdentificacion">
                        Identificación
                    </label>

                    <input
                        type="text"
                        id="nuevaIdentificacion"
                        placeholder="Número de identificación"
                    >
                </div>

                <div class="campo-formulario">
                    <label for="nuevoTelefono">
                        Teléfono
                    </label>

                    <input
                        type="text"
                        id="nuevoTelefono"
                        placeholder="Teléfono"
                    >
                </div>

                <button
                    type="button"
                    id="btnGuardarVisitante"
                    class="btn-registrar"
                >
                    Registrar visitante
                </button>

                <div
                    id="mensajeVisitanteCreado"
                    class="mensaje-exito"
                    style="display: none;"
                >
                    Visitante registrado correctamente.
                </div>
            </div>

            <!-- ID interno del visitante seleccionado o creado -->
            <input
                type="hidden"
                id="idVisitante"
                name="id_visitante"
            >

            <!-- Datos para registrar el acceso -->
            <div id="datosAcceso">

                <div class="campo-formulario">
                    <label for="areaSelect">
                        Área a visitar
                    </label>

                    <select
                        id="areaSelect"
                        name="id_area"
                        required
                    >
                        <option value="">
                            Selecciona un área
                        </option>
                    </select>
                </div>

                <div class="campo-formulario">
                    <label for="anfitrionSelect">
                        Anfitrión
                    </label>

                    <select
                        id="anfitrionSelect"
                        name="id_usuario"
                        required
                    >
                        <option value="">
                            Selecciona un anfitrión
                        </option>
                    </select>
                </div>

                <div class="campo-formulario">
                    <label for="motivoVisita">
                        Motivo de la visita
                    </label>

                    <textarea
                        id="motivoVisita"
                        name="motivo_visita"
                        rows="3"
                        placeholder="Describe el motivo de la visita"
                        required
                    ></textarea>
                </div>

                <div class="acciones-modal">
                    <button
                        type="button"
                        id="btnCancelar"
                        class="btn-cancelar"
                    >
                        Cancelar
                    </button>

                    <button
                        type="submit"
                        class="btn-registrar"
                    >
                        Registrar ingreso
                    </button>
                </div>

            </div>

        </form>

    </div>
</div>
