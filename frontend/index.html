<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login Page</title>
        <link rel="stylesheet" href="estilos/login.css">
    </head>

    <body>
        <div class="container">
            <div class="container-form">
                <form class="sign-in" id="login">
                    <img class="logo"  src="imagenes/empresalogo.png">
                    <h2>Iniciar Sesion</h2>
                    <span>Use su correo y contrasena</span>
                    <div class="container-input">
                        <img class="correo" src="imagenes/correologo.png">
                        <input type="text" id="email" placeholder="Ingrese su email">
                    </div>
                    <div class="container-input">
                        <img class="correo" src="imagenes/locklogo.png">
                        <input type="password" id="password" placeholder="Ingrese su contrasena">
                    </div>
                    <button>Iniciar Sesion</button>
                </form>
            </div>
        </div>

        <script src="scripts/login.js"></script>
    </body>
</html>
