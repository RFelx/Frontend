<!-- modal.html -->
<link rel="stylesheet" href="../estilos/modal.css">
<div id="modal" class="modal">
  <div class="modal-content">
    <span id="cerrar" class="close">&times;</span>
    <h3>Nuevo Registro</h3>
    <form id="formRegistro">
      <label>ID Visitante:</label>
      <input type="text" name="id_visitante"><br>

      <label>ID Área:</label>
      <input type="text" name="id_area"><br>

      <label>ID Usuario:</label>
      <input type="text" name="id_usuario"><br>

      <label>Anfitrion:</label>
      <input type="text" name="anfitrion"><br>

      <label>Motivo de Visita:</label>
      <input type="text" name="motivo_visita"><br>
      

      <button type="submit">Guardar</button>
    </form>
  </div>
</div>
